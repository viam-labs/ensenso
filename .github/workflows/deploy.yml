name: Deploy Module
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.0.1)
        required: true

permissions:
  contents: read

env:
  VIAM_CLI_BASE_URL: https://storage.googleapis.com/packages.viam.com/apps/viam-cli
  MODULE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  update-meta:
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Install Viam CLI
        run: |
          curl --fail --silent --show-error --location \
            "${VIAM_CLI_BASE_URL}/viam-cli-stable-linux-amd64" -o viam
          chmod +x viam
          sudo mv viam /usr/local/bin/viam

      - name: Authenticate with Viam
        env:
          VIAM_KEY_ID: ${{ secrets.VIAM_KEY_ID }}
          VIAM_KEY_VALUE: ${{ secrets.VIAM_KEY_SECRET }}
        run: viam login api-key --key-id "$VIAM_KEY_ID" --key "$VIAM_KEY_VALUE"

      - name: Update module metadata
        run: viam module update --module meta.json

  build-and-upload:
    needs: update-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      ENSENSO_SDK_VERSION: ${{ vars.ENSENSO_SDK_VERSION }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Check required variables
        run: |
          if [[ -z "$ENSENSO_SDK_VERSION" ]]; then
            echo "::error::Missing repository Actions variable: ENSENSO_SDK_VERSION"
            echo "Configure it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Install Ensenso SDK
        run: |
          ENSENSO_DEB="ensenso-sdk-${ENSENSO_SDK_VERSION}-x64.deb"
          curl --fail --silent --show-error --location \
            "https://download.optonic.com/s/ensensosdk/download?files=${ENSENSO_DEB}" \
            -o "${ENSENSO_DEB}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./${ENSENSO_DEB}"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Setup
        run: make setup

      - name: Build module.tar.gz
        run: make module.tar.gz

      - name: Verify build artifact
        run: |
          test -f module.tar.gz
          tar tzf module.tar.gz | sort

      - name: Install Viam CLI
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          curl --fail --silent --show-error --location \
            "${VIAM_CLI_BASE_URL}/viam-cli-stable-linux-${ARCH}" -o viam
          chmod +x viam
          sudo mv viam /usr/local/bin/viam

      - name: Authenticate with Viam
        env:
          VIAM_KEY_ID: ${{ secrets.VIAM_KEY_ID }}
          VIAM_KEY_VALUE: ${{ secrets.VIAM_KEY_SECRET }}
        run: viam login api-key --key-id "$VIAM_KEY_ID" --key "$VIAM_KEY_VALUE"

      - name: Upload module artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          viam module upload \
            --module meta.json \
            --version "$MODULE_VERSION" \
            --platform "$PLATFORM" \
            module.tar.gz
